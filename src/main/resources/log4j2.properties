status = warn
name = PropertiesConfig

# Appenders
appenders = console, rofi

# Console Appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# Rolling File Appender
appender.rofi.type = RollingFile
appender.rofi.name = RollingFile
appender.rofi.fileName = logs/fileaccess.log
appender.rofi.filePattern = logs/fileaccess-%i.log.gz
appender.rofi.layout.type = PatternLayout
appender.rofi.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
appender.rofi.policies.type = Policies
appender.rofi.policies.size.type = SizeBasedTriggeringPolicy
appender.rofi.policies.size.size = 12 MB
appender.rofi.strategy.type = DefaultRolloverStrategy
appender.rofi.strategy.max = 5

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = console, rofi
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rofi.ref = RollingFile

# Application Logger
logger.fileaccess.name = FileAccess
logger.fileaccess.level = info
logger.fileaccess.additivity = false
logger.fileaccess.appenderRefs = console, rofi
logger.fileaccess.appenderRef.console.ref = ConsoleAppender
logger.fileaccess.appenderRef.rofi.ref = RollingFile